
name: Build Perlisa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source
        run: unzip -o perlisa_offline_source.zip

      - name: Prepare Android
        working-directory: perlisa_offline
        run: |
          flutter create --platforms=android --org ir.perlisa --project-name perlisa .
          flutter pub get

      - name: Build APK
        working-directory: perlisa_offline
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Perlisa-APK
          path: perlisa_offline/build/app/outputs/flutter-apk/app-release.apk

